[project]
name = "enterprise-ai-eval-harness"
version = "0.1.0"
description = "企业AI评测基座｜RAG/Text2SQL/Agent 统一回归评测 · LLM-as-judge · 版本对比 · badcase 归档 · 验收报表"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "FDE阿泽" }]
keywords = ["llm-eval", "enterprise-ai", "rag", "text2sql", "llm-as-judge", "b端"]
dependencies = [
  "fastapi>=0.110,<0.116",
  "uvicorn>=0.29",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "httpx>=0.27",
]

[project.optional-dependencies]
# 可选：LLM-as-judge（不装 litellm 时走确定性打分，离线可跑）
judge = ["litellm>=1.40"]
# 可选：轻量可视化后台
ui = ["streamlit>=1.35"]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_eval_harness"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
